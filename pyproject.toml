[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-recsys"
version = "0.1.0"
description = "Two-Stage Recommender System for H&M Fashion Recommendations"
authors = [{ name = "Cypher (Muhammad Sibtain)" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "mlflow>=2.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.5.0",
]
modeling = [
    "lightgbm>=4.0.0",
    "implicit>=0.7.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["data*", "candidates*", "ranking*", "serving*", "simulator*", "experiments*"]
namespaces = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

